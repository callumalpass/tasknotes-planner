<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fbfcfe" />
    <meta
      name="description"
      content="Plan TaskNotes work across time with a calm, connected Gantt view."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/tasknotes-mark.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem("mdbase:theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>TaskNotes Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
