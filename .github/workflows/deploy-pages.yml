name: Deploy Planner

on:
  workflow_run:
    workflows: ["Verify Planner"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: cloudflare-pages
      url: https://planner.tasknotes.dev/
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production Planner
        run: pnpm build
        env:
          TASKNOTES_PLANNER_URL: https://planner.tasknotes.dev
          VITE_MDBASE_CONNECT_URL: https://connect.mdbase.dev
          VITE_MDBASE_CONNECT_LOOPBACK_URL: http://127.0.0.1:28485
      - name: Deploy Cloudflare Pages
        run: pnpm dlx wrangler@4.114.0 pages deploy dist --project-name=tasknotes-planner --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke production deployment
        run: pnpm test:production-smoke
        env:
          TASKNOTES_PRODUCTION_URL: https://planner.tasknotes.dev
          MDBASE_CONNECT_ORIGIN: https://connect.mdbase.dev
